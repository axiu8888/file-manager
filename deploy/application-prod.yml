# 生产配置（Docker / 同域 nginx 反代）
# 多数项可通过环境变量覆盖（Spring Boot relaxed binding），例如：
#   SPRING_DATASOURCE_URL / USERNAME / PASSWORD
#   SERVER_PORT
#   KIFTD_EMBEDDED_PG / KIFTD_STORAGE_ROOT / KIFTD_STORAGE_TEMP
#   KIFTD_JWT_SECRET / KIFTD_CORS_ALLOWED_ORIGINS

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: false

spring:
  application:
    name: kiftd-backend
  datasource:
    # compose 网络主机名：postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/kiftd}
    username: ${SPRING_DATASOURCE_USERNAME:kiftd}
    password: ${SPRING_DATASOURCE_PASSWORD:kiftd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  mvc:
    async:
      request-timeout: 3600000

kiftd:
  embedded-pg: ${KIFTD_EMBEDDED_PG:false}
  jwt:
    # 生产环境务必通过 KIFTD_JWT_SECRET 覆盖
    secret: ${KIFTD_JWT_SECRET:change-me}
    expire-hours: ${KIFTD_JWT_EXPIRE_HOURS:72}
  storage:
    # 容器内路径，对应宿主机 /opt/apps/kiftd/data 卷
    root: ${KIFTD_STORAGE_ROOT:/opt/apps/kiftd/data/filenodes}
    temp: ${KIFTD_STORAGE_TEMP:/opt/apps/kiftd/data/temp}
  signup:
    enabled: "${KIFTD_SIGNUP_ENABLED:true}"
  ffmpeg:
    path: ${KIFTD_FFMPEG_PATH:ffmpeg}
  cors:
    # 同域经 nginx 访问时可留空；若前后端跨域再填写来源，逗号分隔
    allowed-origins: "${KIFTD_CORS_ALLOWED_ORIGINS:}"
  admin:
    username: ${KIFTD_ADMIN_USERNAME:admin}
    password: ${KIFTD_ADMIN_PASSWORD:change-me}
  select-step: 100
  webdav:
    enabled: true
    path: /webdav/*

logging:
  level:
    com.kiftd: INFO
  file:
    name: ${KIFTD_LOG_FILE:/opt/apps/kiftd/logs/kiftd.log}
