# 主从负载配置
# upstream support-web-proxy {
#     zone support-web-proxy 64k;
#     server support-web:7777 max_fails=10 fail_timeout=10s;
#     #server support-web-slave:7777 backup;
#     # health_check interval=30s uri=/health;
# }
server {
    listen 80;
    listen 443 ssl;
    server_name nginx-net;
    root /usr/share/nginx/;
    index index.html;


    ssl_certificate /etc/nginx/conf.d/ssl/server.crt;
    ssl_certificate_key /etc/nginx/conf.d/ssl/server.key;
    #ssl_protocols SSLv2 SSLv3 TLSv1.2;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on; # 依赖SSLv3和TLSv1协议的服务器密码将优先于客户端密码
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling off;

    client_max_body_size 8g;

    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 600s;

    proxy_set_header X-Real_IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X_Forward_For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # 修复token过大的问题
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    #add_header "Cache-Control" "private, no-store, no-cache, must-revalidate, proxy-revalidate";
    #add_header 'Access-Control-Allow-Origin' '*';
    #add_header 'Access-Control-Allow-Credentials' 'true';
    #add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    #add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    #开启gzip功能
    gzip on;
    #开启gzip静态压缩功能
    gzip_static on;
    #gzip缓存大小
    gzip_buffers 4 16k;
    #gzip http版本
    gzip_http_version 1.1;
    #gzip 压缩级别 1-10
    gzip_comp_level 5;
    #gzip 压缩类型
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    # 是否在http header中添加Vary: Accept-Encoding，建议开启
    gzip_vary on;

    # ==================== api ====================

    # kiftd REST（^~ 避免被下面的 SPA 正则当成静态应用）
    location ^~ /api {
        proxy_pass http://kiftd-backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    location ^~ /webdav {
        proxy_pass http://kiftd-backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # location ^~ /mqtt {
    #     proxy_pass http://emqx-net:8083/mqtt/;
    # }

    # ==================== 静态应用配置 ====================

    # 根路径重定向到 kiftd
    location = / {
        return 302 /kiftd/;
    }

    # kiftd SPA：产物放到 /usr/share/nginx/kiftd/（即宿主机 nginx/share/kiftd）
    location ^~ /kiftd {
        try_files $uri $uri/ /kiftd/index.html;
    }

    # 图片资源
    location ^~ /public/ {
        root /usr/share/nginx/public;
        try_files $uri $uri/ =404;
    }

    # 匹配所有应用的路由规则
    location ~ ^/(?<app_name>[^/]+) {
        # 静态资源匹配
        location ~ .*\.(?<app_name_capture>[^/]+)\.(jpg|jpeg|gif|png|ico|css|js|pdf|txt|woff|ttf|woff2|eot|svg)$ {
            # 验证应用名是否匹配
            if ($app_name = $app_name_capture) {
                root nginx/html;
            }
        }

        # # 单页应用路由
        try_files $uri $uri/ /$app_name/index.html last;
    }
}

