# kiftd 单机 Docker Compose：postgres + app(jar) + nginx
# 推荐部署根目录：/opt/apps/kiftd
# 用法见 deploy/README.md

name: kiftd

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiftd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiftd}
      POSTGRES_USER: ${POSTGRES_USER:-kiftd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiftd}
    volumes:
      - ${KIFTD_HOST_ROOT:-/opt/apps/kiftd}/data/postgres:/var/lib/postgresql/data
    networks:
      - kiftd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: kiftd-app:latest
    container_name: kiftd-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/opt/apps/kiftd/config/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kiftd}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kiftd}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kiftd}
      KIFTD_EMBEDDED_PG: "false"
      KIFTD_STORAGE_ROOT: /opt/apps/kiftd/data/filenodes
      KIFTD_STORAGE_TEMP: /opt/apps/kiftd/data/temp
      KIFTD_JWT_SECRET: ${KIFTD_JWT_SECRET:-change-me}
      KIFTD_JWT_EXPIRE_HOURS: ${KIFTD_JWT_EXPIRE_HOURS:-72}
      # 同域 nginx 反代：可留空
      KIFTD_CORS_ALLOWED_ORIGINS: ${KIFTD_CORS_ALLOWED_ORIGINS:-}
      KIFTD_ADMIN_USERNAME: ${KIFTD_ADMIN_USERNAME:-admin}
      KIFTD_ADMIN_PASSWORD: ${KIFTD_ADMIN_PASSWORD:-change-me}
      KIFTD_SIGNUP_ENABLED: ${KIFTD_SIGNUP_ENABLED:-true}
      KIFTD_FFMPEG_PATH: ffmpeg
      KIFTD_LOG_FILE: /opt/apps/kiftd/logs/kiftd.log
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m}
    volumes:
      - ${KIFTD_HOST_ROOT:-/opt/apps/kiftd}/data:/opt/apps/kiftd/data
      - ${KIFTD_HOST_ROOT:-/opt/apps/kiftd}/logs:/opt/apps/kiftd/logs
      - ${KIFTD_HOST_ROOT:-/opt/apps/kiftd}/config:/opt/apps/kiftd/config:ro
    # 仅内网暴露；对外由 nginx:80 提供
    expose:
      - "8080"
    networks:
      - kiftd-net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: kiftd-nginx:latest
    container_name: kiftd-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - kiftd-net

networks:
  kiftd-net:
    driver: bridge
