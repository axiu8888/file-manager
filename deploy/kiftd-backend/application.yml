server:
  port: 80
  servlet:
    # 必须保持 /。REST 前缀用 kiftd.api-prefix，不要改 context-path
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: false
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1
    # 超长文件名需要大于默认 512B
    max-part-header-size: 16KB
    max-part-count: 100
    connection-timeout: 3600000

spring:
  # profiles:
  #   active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: kiftd-backend
  datasource:
    url: jdbc:postgresql://mynet-postgres:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20GB
      max-request-size: 20GB
      file-size-threshold: 10MB
  mvc:
    async:
      # 视频/大文件流式传输可能超过默认 30s
      request-timeout: 3600000

kiftd:
  # REST 前缀（不含尾斜杠）。改成 /api：这里改为 /api，前端 VITE_API_PREFIX=/api。
  api-prefix: ${KIFTD_API_PREFIX:/api}
  embedded-pg: false
  jwt:
    secret: kiftd-dev-secret-change-me-to-a-long-random-string-at-least-256-bits
    expire-hours: 72
  storage:
    root: /opt/app/data/filenodes
    temp: /opt/app/data/temp
  signup:
    enabled: true
  ffmpeg:
    path: ffmpeg
  cors:
    # * 表示任意来源均可跨域
    allowed-origins: "*"
  admin:
    username: root
    password: admin
  select-step: 100
  webdav:
    enabled: true
    path: /webdav/*
  backup:
    enabled: true
    dir: /opt/app/data/backup
    cron: "0 0 1 * * ?"
    zone: Asia/Shanghai
    keep-days: 30
  http-logging:
    enabled: true
    multi-line: false
    exclude-paths:
      - ${kiftd.api-prefix:/api}/preview/resource/**
      - ${kiftd.api-prefix:/api}/system/ping
      - /webdav
      - /webdav/**

logging:
  level:
    com.kiftd: INFO
