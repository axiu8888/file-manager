# 根目录可选：仅启动开发用 PostgreSQL
# 完整生产编排见 deploy/docker-compose.yml（postgres + app + nginx）

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiftd-postgres
    environment:
      POSTGRES_DB: kiftd
      POSTGRES_USER: kiftd
      POSTGRES_PASSWORD: kiftd
    ports:
      - "5432:5432"
    volumes:
      - kiftd_pg_data:/var/lib/postgresql/data

volumes:
  kiftd_pg_data:
