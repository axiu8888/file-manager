# 使用外部 PostgreSQL 的生产配置（Docker / 同域 nginx）
# 启动示例：
#   java -jar app.jar --spring.profiles.active=prod \
#     --spring.config.additional-location=file:./config/
# 或通过环境变量覆盖（推荐）：
#   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/kiftd
#   SPRING_DATASOURCE_USERNAME=kiftd
#   SPRING_DATASOURCE_PASSWORD=change-me
#   KIFTD_EMBEDDED_PG=false
#   KIFTD_STORAGE_ROOT=/opt/app/data/filenodes
#   KIFTD_JWT_SECRET=change-me
#   SERVER_PORT=8080

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1
    max-part-header-size: 16KB
    max-part-count: 100
    connection-timeout: 3600000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/kiftd}
    username: ${SPRING_DATASOURCE_USERNAME:kiftd}
    password: ${SPRING_DATASOURCE_PASSWORD:kiftd}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20GB
      max-request-size: 20GB
      file-size-threshold: 10MB

kiftd:
  embedded-pg: false
  api-prefix: ${KIFTD_API_PREFIX:/api}
  jwt:
    secret: ${KIFTD_JWT_SECRET:change-me}
    expire-hours: ${KIFTD_JWT_EXPIRE_HOURS:72}
  storage:
    root: ${KIFTD_STORAGE_ROOT:/opt/app/data/filenodes}
    temp: ${KIFTD_STORAGE_TEMP:/opt/app/data/temp}
  cors:
    # 同域经 nginx 访问可留空；跨域再填写，逗号分隔
    allowed-origins: ${KIFTD_CORS_ALLOWED_ORIGINS:}
  admin:
    username: ${KIFTD_ADMIN_USERNAME:admin}
    password: ${KIFTD_ADMIN_PASSWORD:change-me}
  signup:
    enabled: ${KIFTD_SIGNUP_ENABLED:true}
  ffmpeg:
    path: ${KIFTD_FFMPEG_PATH:ffmpeg}
