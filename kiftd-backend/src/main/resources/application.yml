server:
  port: 80
  servlet:
    # 必须保持 /。REST 前缀用 kiftd.api-prefix；改 context-path 会连 WebDAV 一起套进去，还会和 api-prefix 叠成 /api/api
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: false
  tomcat:
    # 默认约 2MB，大文件上传会 MaxUploadSizeExceededException
    max-http-form-post-size: -1
    max-swallow-size: -1
    # Tomcat 10.1.42+ 默认 multipart 单 part 头仅 512B；超长中文文件名会触发 Header section has more than 512 bytes
    max-part-header-size: 16KB
    max-part-count: 100
    connection-timeout: 3600000

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: kiftd-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 单文件 / 整次请求上限（显式 20GB，避免 -1 在部分环境下未生效）
      max-file-size: 20GB
      max-request-size: 20GB
      file-size-threshold: 10MB
  mvc:
    async:
      # 视频/大文件流式传输可能超过默认 30s
      request-timeout: 3600000

kiftd:
  # REST 前缀（不含尾斜杠）。改成 /api：这里改为 /api，前端 VITE_API_PREFIX=/api。WebDAV 仍是 /webdav。
  api-prefix: ${KIFTD_API_PREFIX:/api}
  embedded-pg: false
  jwt:
    secret: kiftd-dev-secret-change-me-to-a-long-random-string-at-least-256-bits
    expire-hours: 72
  storage:
    root: ./data/filenodes
    temp: ./data/temp
  signup:
    enabled: true
  ffmpeg:
    path: ffmpeg
  cors:
    # * 表示任意来源。限定时写成 http://localhost:5173,https://example.com
    allowed-origins: "*"
  admin:
    username: root
    password: admin
  select-step: 100
  webdav:
    enabled: true
    path: /webdav/*
  http-logging:
    enabled: true
    multi-line: true
    exclude-paths:
      - ${kiftd.api-prefix:/api}/preview/resource/**
      - ${kiftd.api-prefix:/api}/system/ping
      - /webdav
      - /webdav/**

logging:
  level:
    com.kiftd: INFO
